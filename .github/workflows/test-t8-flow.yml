name: T8 申万行业行情探测
on:
  push:
    branches: [gpt/T8-flow]
    paths: ['scripts/probe_flow.py', 'tests/test_probe_flow.py', '.github/workflows/test-t8-flow.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t8-readonly-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/gpt/T8-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: 离线验证与固定引擎
        run: |
          set -euo pipefail
          mkdir -p logs/test/T8
          python -m unittest discover -s tests -v 2>&1 | tee logs/test/T8/离线测试.txt
          md5sum -c engine/ENGINE_MD5.txt
      - name: 实测申万、腾讯和新浪
        run: python -u scripts/probe_flow.py
      - name: 正式目录保护
        if: always()
        run: test -z "$(git status --porcelain -- data engine archive judgments system graph)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T8-行业行情探测
          path: |
            logs/资金轮动探测.txt
            logs/test/T8/
