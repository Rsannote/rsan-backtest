name: T12b 一致预期离线验收
on:
  push:
    branches: [gpt/T12b-consensus]
    paths: ['scripts/consensus_common.py', 'scripts/compare_consensus.py', 'scripts/update_consensus.py', 'tests/test_compare_consensus.py', 'tests/test_update_consensus.py', '.github/workflows/test-t12b-consensus.yml', '.github/workflows/consensus.yml', 'system/一致预期格式.md', 'system/运行清单.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t12b-readonly-verification
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/gpt/T12b-consensus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: 离线门槛检查和固定引擎
        run: |
          set -euo pipefail
          mkdir -p logs/test/T12b
          python -m unittest discover -s tests -v 2>&1 | tee logs/test/T12b/离线测试.txt
          md5sum -c engine/ENGINE_MD5.txt
      - name: 核验已捕获50只门槛；没有证据才首次联网比对
        run: |
          if [ -f logs/test/T12b/来源比对_50.json ]; then
            PYTHONPATH=scripts python - <<'PY'
          from update_consensus import checked_decision,load
          print(checked_decision(load('logs/test/T12b/来源比对_50.json')))
          PY
          else
            python -u scripts/compare_consensus.py
          fi
      - name: 正式目录保护
        if: always()
        run: test -z "$(git status --porcelain -- data engine archive judgments system graph)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T12b-来源比对
          path: logs/test/T12b/
