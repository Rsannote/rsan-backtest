name: T12b 一致预期来源比对
on:
  push:
    branches: [gpt/T12b-consensus]
    paths: ['scripts/consensus_common.py', 'scripts/compare_consensus.py', 'tests/test_compare_consensus.py', '.github/workflows/test-t12b-consensus.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t12b-readonly-verification
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/gpt/T12b-consensus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: 离线门槛检查和固定引擎
        run: |
          set -euo pipefail
          mkdir -p logs/test/T12b
          python -m unittest discover -s tests -v 2>&1 | tee logs/test/T12b/离线测试.txt
          md5sum -c engine/ENGINE_MD5.txt
      - name: 全量东财后固定随机50只比对
        run: python -u scripts/compare_consensus.py
      - name: 正式目录保护
        if: always()
        run: test -z "$(git status --porcelain -- data engine archive judgments system graph)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T12b-来源比对
          path: logs/test/T12b/
