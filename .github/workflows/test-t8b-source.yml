name: T8b 来源与单位核对
on:
  push:
    branches: [gpt/T8b-flow]
    paths: ['.github/workflows/test-t8b-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: 取公开中间CA并验证当前官网证书链
        run: |
          set -euo pipefail
          mkdir -p logs/test/T8b/源探测/原始
          curl --fail --silent --show-error --max-time 25 'https://cacerts.digicert.com/GeoTrustG2TLSCNRSA4096SHA2562022CA1.crt' -o /tmp/sw-ca.der
          openssl x509 -inform DER -in /tmp/sw-ca.der -out logs/test/T8b/源探测/申万中间CA.pem
          timeout 20 openssl s_client -connect www.swsresearch.com:443 -servername www.swsresearch.com -showcerts </dev/null > /tmp/sw-server.pem 2>logs/test/T8b/源探测/TLS验证.txt || true
          openssl x509 -in /tmp/sw-server.pem -out /tmp/sw-leaf.pem
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt -untrusted logs/test/T8b/源探测/申万中间CA.pem -purpose sslserver -verify_hostname www.swsresearch.com /tmp/sw-leaf.pem >> logs/test/T8b/源探测/TLS验证.txt 2>&1
          openssl x509 -in logs/test/T8b/源探测/申万中间CA.pem -noout -subject -issuer -dates -fingerprint -sha256 >> logs/test/T8b/源探测/TLS验证.txt
          cat /etc/ssl/certs/ca-certificates.crt logs/test/T8b/源探测/申万中间CA.pem > /tmp/sw-trust.pem
          echo 'FLOW_CA_BUNDLE=/tmp/sw-trust.pem' >> "$GITHUB_ENV"
      - name: 取31行业原始日线并按最近10个共同交易日核对
        run: |
          PYTHONPATH=scripts python -u - <<'PY'
          import csv,json,hashlib,time,pathlib,datetime
          from probe_flow import SW,FlowHTTP,industry_list,urllib
          root=pathlib.Path('logs/test/T8b/源探测');client=FlowHTTP(time.monotonic()+600)
          address=SW+'current/?'+urllib.parse.urlencode({'page':1,'page_size':100,'indextype':'一级行业'})
          industries=industry_list(client.get(address));assert len(industries)==31
          (root/'行业列表.json').write_text(json.dumps(industries,ensure_ascii=False,indent=2))
          amounts={}
          for code,name in sorted(industries.items()):
              text=client.get(SW+'trend/?'+urllib.parse.urlencode({'swindexcode':code,'period':'DAY'}))
              obj=json.loads(text);(root/'原始'/f'{code}.json').write_text(text)
              values={str(r['bargaindate'])[:10]:float(r['bargainsum']) for r in obj['data']}
              amounts[code]=values;print(code,name,len(values),flush=True)
          market={r['date']:r for r in csv.DictReader(open('data/市场状态/日指标.csv'))}
          target=list(csv.DictReader(open('data/行情库/指数/sh000300.csv')))[-1]['date']
          common=sorted(set(market).intersection(*(set(a) for a in amounts.values())))
          dates=[d for d in common if '2021-12-13'<=d<=target][-10:];assert len(dates)==10
          rows=[]
          for d in dates:
              total=sum(a[d] for a in amounts.values());m=float(market[d]['成交额亿']);rows.append({'date':d,'申万31合计原值':total,'市场成交额亿':m,'来源标记':market[d]['来源'],'按亿元比较偏差':total/m-1,'±15%内':abs(total/m-1)<=.15})
          report={'北京时间':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat(),'数据截止':target,'行业数':len(industries),'10日核对':rows,'全部±15%内':all(r['±15%内'] for r in rows),'请求':client.trace}
          (root/'单位核对.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report['10日核对'],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T8b-源数据与证书
          path: logs/test/T8b/源探测/
