name: 每日社区情绪数据

# 工作日收盘后抓东财人气/飙升榜、同花顺热股/概念榜、股吧帖子、tophub 财经热榜（含股吧、雪球、集思录）、微博热搜，存到 data/社区情绪/日期/。
# 另抓股吧、集思录热门帖子的正文和回复，存为 讨论摘录.md 和 讨论原始.jsonl。
# 每个榜单独容错，失败原因写在当天目录的 运行记录.txt。

on:
  schedule:
    - cron: "37 7 * * 1-5"   # 北京时间 15:37
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install pandas numpy akshare
      - name: 抓取情绪数据
        run: python3 scripts/fetch_sentiment.py
      - name: 抓取热门帖子正文和回复（股吧、集思录）
        if: always()
        continue-on-error: true
        run: python3 scripts/fetch_discussion.py
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/社区情绪
          git commit -m "社区情绪 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
      - name: 工作流失败告警
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: community
          HEALTH_ITEM_NAME: 社区情绪
          HEALTH_WORKFLOW_FILE: .github/workflows/community-sentiment.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
