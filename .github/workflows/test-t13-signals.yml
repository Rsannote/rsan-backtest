name: T13 主线信号离线验收
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/mainline_*.py', 'tests/test_mainline_signals.py', 'system/运行清单.d/主线信号.json']
permissions:
  contents: read
concurrency:
  group: t13-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: 全部单元测试与固定输入
        run: |
          set -euo pipefail
          mkdir -p logs/test/T13
          python -m unittest discover -s tests -v 2>&1 | tee logs/test/T13/离线测试.txt
          md5sum -c engine/ENGINE_MD5.txt
          test -z "$(git status --porcelain -- data engine archive judgments graph system/行业清单.csv system/催化日历.csv)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T13-单元测试
          path: logs/test/T13/离线测试.txt
