name: 看板发布
on:
  workflow_run:
    workflows: ['主线信号更新', '运行健康检查']   # 每日信号出来后、每次健康检查后各刷新一次
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  actions: read
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: 生成看板数据（只读已有产出）
        run: python3 scripts/build_site.py --out site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 工作流失败告警
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: site
          HEALTH_ITEM_NAME: 轻量看板
          HEALTH_WORKFLOW_FILE: .github/workflows/site.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
