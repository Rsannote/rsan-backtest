name: T11 主分支 Git 快照
on:
  push:
    branches: [gpt/T11-retry]
    paths: [.github/workflows/test-t11-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 导出完整 main Git 历史
        run: |
          git fetch origin main
          git bundle create /tmp/rsan-next-main.bundle refs/remotes/origin/main
          git rev-parse origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: T11-main-git-snapshot
          path: /tmp/rsan-next-main.bundle
          retention-days: 1
