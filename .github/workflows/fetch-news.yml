name: 新闻库抓取

# 每天四次抓财经快讯、官方政策发布和股票池公司公告，按 system/新闻归类.json 初分后入库 data/新闻/。
# 最近 24 小时的重要条目见 data/新闻/最新.md。
# 16:23、21:11 两次还会记下当天收盘后的成交额和涨跌停（scripts/market_state.py --capture）。

on:
  schedule:
    - cron: "47 23 * * *"   # 北京时间 07:47
    - cron: "13 4 * * *"    # 北京时间 12:13
    - cron: "23 8 * * *"    # 北京时间 16:23
    - cron: "11 13 * * *"   # 北京时间 21:11
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install pandas numpy
      - name: 抓取新闻
        run: python3 scripts/fetch_news.py
      - name: 顺手记录当天收盘后的实时市场指标（不依赖行情库，防止定时任务拖过午夜）
        if: always()
        continue-on-error: true
        run: python3 scripts/market_state.py --capture
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/新闻 data/市场状态/日指标.csv
          git commit -m "新闻库 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
      - name: 工作流失败告警
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: news
          HEALTH_ITEM_NAME: 新闻库
          HEALTH_WORKFLOW_FILE: .github/workflows/fetch-news.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
