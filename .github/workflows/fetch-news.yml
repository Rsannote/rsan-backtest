name: 新闻库抓取

# 每天四次抓财经快讯、官方政策发布和股票池公司公告，按 system/新闻归类.json 初分后入库 data/新闻/。
# 最近 24 小时的重要条目见 data/新闻/最新.md。

on:
  schedule:
    - cron: "47 23 * * *"   # 北京时间 07:47
    - cron: "13 4 * * *"    # 北京时间 12:13
    - cron: "23 8 * * *"    # 北京时间 16:23
    - cron: "11 13 * * *"   # 北京时间 21:11
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 抓取新闻
        run: python3 scripts/fetch_news.py
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/新闻
          git commit -m "新闻库 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
