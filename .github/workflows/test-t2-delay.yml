name: T2 延迟校准与历史回放验收

on:
  push:
    branches: [gpt/T2-health]
    paths:
      - scripts/run_delay_stats.py
      - scripts/health_check.py
      - tests/test_health_check.py
      - tests/test_run_delay_stats.py
      - .github/workflows/test-t2-delay.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/gpt/T2-health'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装既有测试依赖
        run: python3 -m pip install pandas numpy requests
      - name: 统计近四周并校准清单，回放两周检查时刻
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p logs/test/T2/延迟校准
          git fetch origin main
          python3 scripts/run_delay_stats.py --ref origin/main --collect-actions --apply-manifest --replay --probe-time 2026-10-28T21:42:00+08:00 | tee logs/test/T2/延迟校准/执行记录.txt
      - name: 完整离线测试与引擎校验
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee logs/test/T2/延迟校准/离线测试.txt
          md5sum -c engine/ENGINE_MD5.txt | tee logs/test/T2/延迟校准/引擎校验.txt
      - name: 生成修订后的真实健康报告（不发送告警）
        run: python3 scripts/health_check.py --json-out logs/健康检查_最新.json
      - name: 正式数据与回测口径保护
        if: always()
        run: git diff --exit-code -- data engine archive judgments graph
      - name: 保存统计、校准与回放证据
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          for path in system/运行清单.json logs/运行延迟统计.md logs/运行延迟统计.json logs/test/T2/延迟校准 logs/健康检查_最新.md logs/健康检查_最新.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "T2：保存实测延迟、宽限与历史回放验收证据"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
