name: 检测行情数据源

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检测数据源连通性
        run: python3 scripts/check_sources.py
      - name: 把检测结果存回仓库
        if: always()
        run: |
          mkdir -p logs
          cp source_check.json "logs/source_check_$(date -u +%Y-%m-%d_%H%M).json"
          cp source_check.json logs/source_check_latest.json
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add logs
          git commit -m "记录数据源检测结果" || exit 0
          git pull --rebase origin main
          git push
      - name: 工作流失败告警
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: workflow:check-sources.yml
          HEALTH_ITEM_NAME: 检测行情数据源
          HEALTH_WORKFLOW_FILE: .github/workflows/check-sources.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
