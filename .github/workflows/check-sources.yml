name: 检测行情数据源

on:
  workflow_dispatch:
  schedule:
    # 北京时间 15:45（收盘后），周一到周五
    - cron: "45 7 * * 1-5"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检测数据源连通性
        run: python3 scripts/check_sources.py
      - name: 把检测结果存回仓库
        if: always()
        run: |
          mkdir -p logs
          cp source_check.json "logs/source_check_$(date -u +%Y-%m-%d_%H%M).json"
          cp source_check.json logs/source_check_latest.json
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add logs
          git commit -m "记录数据源检测结果" || exit 0
          git push
