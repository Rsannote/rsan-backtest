name: T4b 主分支 Git 快照
on:
  push:
    branches: [gpt/T4b-rules]
    paths: [.github/workflows/test-t4b-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t4b-readonly-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 导出完整 main Git 历史
        run: |
          git fetch origin main
          git bundle create /tmp/rsan-t4b-main.bundle refs/remotes/origin/main
          git rev-parse origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: T4b-main-git-snapshot
          path: /tmp/rsan-t4b-main.bundle
          retention-days: 1
