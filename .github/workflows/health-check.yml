name: 运行健康检查

on:
  schedule:
    - cron: "20 0 * * *"   # 北京时间每天 08:20
    - cron: "30 14 * * *"  # 北京时间每天 22:30
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 更新或核验官方全年休市表
        run: python3 scripts/update_trade_calendar.py
      - name: 检查全部定时产出
        if: always()
        run: python3 scripts/health_check.py --json-out logs/健康检查_最新.json
      - name: 同步异常与恢复 Issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/health_alert.py --report logs/健康检查_最新.json
      - name: 保存健康报告
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          for path in logs/健康检查_最新.md logs/健康检查_最新.json system/交易所休市.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "运行健康检查 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
      - name: 工作流失败告警
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: health_check
          HEALTH_ITEM_NAME: 运行健康检查
          HEALTH_WORKFLOW_FILE: .github/workflows/health-check.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
