name: T8 申万TLS诊断
on:
  push:
    branches: [gpt/T8-flow]
    paths: ['.github/workflows/test-t8-tls.yml']
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - name: 记录服务器公开证书链与系统校验结果
        run: |
          mkdir -p logs/test/T8
          timeout 20 openssl s_client -connect www.swsresearch.com:443 -servername www.swsresearch.com -showcerts </dev/null > /tmp/sw-chain.pem 2>logs/test/T8/TLS诊断.txt || true
          openssl x509 -in /tmp/sw-chain.pem -noout -subject -issuer -ext authorityInfoAccess >> logs/test/T8/TLS诊断.txt
      - uses: actions/upload-artifact@v4
        with:
          name: T8-TLS诊断
          path: logs/test/T8/TLS诊断.txt
