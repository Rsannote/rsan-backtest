name: 市场状态

# 每个交易日行情库更新完成后自动运行：取两市成交额、涨跌停炸板、融资余额，结合行情库的沪深300和行业ETF，
# 按 system/市场状态规则.md 算出攻守、冷热、主线和资金流向。结果：data/市场状态/最新.md、最新.json。
# 也可以在 Actions 页面手动运行（可选强制重算）。

on:
  workflow_run:
    workflows: ["行情库自动更新"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "强制重算最新交易日"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 安装依赖
        run: pip install pandas numpy
      - name: 计算市场状态
        run: python3 scripts/market_state.py ${{ inputs.force && '--force' || '' }}
      - name: 程序判断落档（未批准草案只记日志）
        run: python3 scripts/auto_judgments.py --module 市场状态
      - name: 到期判断自动复核
        run: python3 scripts/auto_review.py
      - name: 校验判断档案
        run: python3 scripts/check_judgments.py --stats
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/市场状态
          git add judgments
          for file in logs/程序判断_市场状态_最新.json logs/程序判断_市场状态_最新.md logs/自动复核_最新.json logs/自动复核_最新.md; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "市场状态与程序判断 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
      - name: 工作流失败告警
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: market_state
          HEALTH_ITEM_NAME: 市场状态
          HEALTH_WORKFLOW_FILE: .github/workflows/market-state.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
