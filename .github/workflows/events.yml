name: 历史事件库更新
on:
  workflow_run:
    workflows: ['行情库自动更新', '宏观数据更新']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 从已存数据计算
        run: python3 scripts/build_events.py
      - name: 保存事件追加与当前表
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -- data/事件库 logs/事件库_最新.json logs/事件库_最新.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "事件库更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: 工作流失败告警
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: events
          HEALTH_ITEM_NAME: 历史事件库
          HEALTH_WORKFLOW_FILE: .github/workflows/events.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
