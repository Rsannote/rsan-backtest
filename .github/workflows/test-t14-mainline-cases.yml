name: T14b 主线案例v1验收
on:
  workflow_dispatch:
    inputs:
      verify_public:
        description: '在Actions重取已定位的一手公开PDF（可达性另记，不代替文本/规则核验）'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'scripts/mainline_cases*.py'
      - 'tests/test_mainline_cases*.py'
      - 'tests/verify_t14*.py'
      - 'system/主线案例*'
      - 'data/事件库/主线*'
      - '.github/workflows/*t14*.yml'
permissions:
  contents: read
concurrency:
  group: t14-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPYCACHEPREFIX: /tmp/t14-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: 必要边界测试与固定引擎
        run: |
          set -euo pipefail
          mkdir -p logs/test/T14b
          python -m unittest discover -s tests -p 'test_mainline_cases*.py' -v 2>&1 | tee logs/test/T14b/离线测试.txt
          md5sum -c engine/ENGINE_MD5.txt
      - name: 真实全回补、重复字节幂等与固定窗口核对
        run: |
          set -euo pipefail
          python scripts/mainline_cases.py --backfill
          python - <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import mainline_cases
          paths = [Path('data/事件库/主线.csv'), Path('data/事件库/主线_总表.md')]
          before = {p: hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          result = mainline_cases.run()
          assert result['追加行数'] == 0, result
          assert all(hashlib.sha256(p.read_bytes()).hexdigest() == value for p, value in before.items())
          print('同输入重复运行：CSV与总表字节不变')
          PY
          python tests/verify_t14_cases.py
          git diff --exit-code -- engine archive judgments graph data/行情库 data/资金轮动 data/主线 data/财报 data/一致预期 data/宏观 data/市场状态 data/社区情绪 scripts/mainline_sources.py scripts/mainline_signals.py system/行业清单.csv system/催化日历.csv system/主线规则.md
      - name: 一手发布PDF重取（仅Actions联网）
        if: github.event_name == 'workflow_dispatch' && inputs.verify_public
        run: python tests/verify_t14_public_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T14b-v0v1案例与固定公开对照
          path: |
            data/事件库/主线.csv
            data/事件库/主线_总表.md
            logs/test/T14b/
