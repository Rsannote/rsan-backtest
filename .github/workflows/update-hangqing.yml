name: 行情库自动更新

# 每个交易日收盘后增量更新；每周六把约四分之一标的全量重抓（四周轮一遍），核对历史数据有没有被数据源改动。
# 也可以在 Actions 页面手动运行（可选全量）。结果见 logs/行情库_最新.md。

on:
  schedule:
    - cron: "40 8 * * 1-5"   # 北京时间周一到周五 16:40
    - cron: "17 2 * * 6"     # 北京时间周六 10:17，轮换全量
  workflow_dispatch:
    inputs:
      full:
        description: "全量重抓"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install pandas numpy
      - name: 更新行情库
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python3 scripts/update_hangqing.py --full
          elif [ "${{ github.event.schedule }}" = "17 2 * * 6" ]; then
            python3 scripts/update_hangqing.py --full --rotate
          else
            python3 scripts/update_hangqing.py
          fi
      - name: 提交更新
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/行情库 logs/行情库_最新.md
          git commit -m "行情库更新 $(TZ=Asia/Shanghai date +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
      - name: 工作流失败告警
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: hangqing
          HEALTH_ITEM_NAME: 行情库
          HEALTH_WORKFLOW_FILE: .github/workflows/update-hangqing.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
