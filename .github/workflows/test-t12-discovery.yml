name: T12 已公开接口结构发现
on:
  push:
    branches: [gpt/T12-consensus]
    paths: ['.github/workflows/test-t12-discovery.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读取公开解析实现
        run: |
          python - <<'PY'
          import urllib.request,json,time
          root='https://api.github.com/repos/akfamily/akshare'
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (RsanConsensusProbe)'})
              with urllib.request.urlopen(req,timeout=20) as r:return r.read().decode('utf-8')
          try:
              info=json.loads(get(root)); branch=info['default_branch'];print('默认分支',branch)
              tree=json.loads(get(root+'/git/trees/'+branch+'?recursive=1'))['tree']
              paths=[r['path'] for r in tree if 'profit_forecast' in r['path'] or ('consensus' in r['path'] and r['path'].endswith('.py'))]
              print('相关公开源文件',json.dumps(paths,ensure_ascii=False))
              for p in paths[:5]:
                  time.sleep(1)
                  print('源码',p,get('https://raw.githubusercontent.com/akfamily/akshare/'+branch+'/'+p)[:22000])
          except Exception as e:print('接口代码发现失败',type(e).__name__,str(e))
          PY
