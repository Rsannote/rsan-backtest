name: T1 行情库分支验收

on:
  push:
    branches: [gpt/T1-etf-fix]
    paths:
      - scripts/probe_etf_listing.py
      - scripts/update_hangqing.py
      - scripts/verify_t1_etf.py
      - scripts/verify_t1_revision.py
      - tests/test_update_hangqing.py
      - .github/workflows/test-t1-etf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/gpt/T1-etf-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装现有依赖
        run: pip install pandas numpy
      - name: 核对固定回测引擎
        run: md5sum -c engine/ENGINE_MD5.txt
      - name: 离线边界测试
        run: |
          mkdir -p logs/test/T1/复审_2026-10-28
          python3 -m unittest discover -s tests -v 2>&1 | tee logs/test/T1/复审_2026-10-28/离线测试.txt
      - name: 隔离目录复审抓取
        run: python3 scripts/verify_t1_revision.py
      - name: 检查正式数据与引擎未被修改
        if: always()
        run: git diff --exit-code -- data engine archive judgments
      - name: 保存分支验收证据
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add logs/test/T1
          git diff --cached --quiet && exit 0
          git commit -m "T1：保存分支验收证据"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
