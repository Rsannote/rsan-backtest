name: 宏观数据更新

on:
  schedule:
    - cron: '35 1 * * *'  # 北京时间09:35，海外收盘与中间价之后
    - cron: '35 10 * * *' # 北京时间18:35，中债可见之后
  workflow_dispatch:
  push:
    branches: [gpt/T6b-macro]
    paths: ['scripts/update_macro.py', 'tests/test_update_macro.py', '.github/workflows/update-macro.yml']

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gpt/T6b-macro'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: 离线测试与引擎保护
        run: |
          set -euo pipefail
          mkdir -p logs/test/T6b
          python -m unittest discover -s tests -v 2>&1 | tee logs/test/T6b/离线测试.txt
          md5sum -c engine/ENGINE_MD5.txt | tee logs/test/T6b/引擎校验.txt
      - name: 正式来源取数与可见性计算
        env:
          BRANCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$BRANCH_REF" = 'gpt/T6b-macro' ]; then
            python -u scripts/update_macro.py --verify --full
          else
            python -u scripts/update_macro.py
          fi
      - name: 正式目录保护
        if: always()
        run: |
          git diff --exit-code -- engine archive graph judgments data/行情库 data/日线_*
      - name: 保存验收产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6b-宏观验收
          path: |
            logs/test/T6b/
            logs/宏观_最新.*
            logs/宏观请求_最新.json
            data/宏观/
      - name: 仅提交宏观数据与运行日志
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -- data/宏观 logs/宏观_最新.md logs/宏观_最新.json logs/宏观请求_最新.json
          if [ "$TARGET_BRANCH" = 'gpt/T6b-macro' ]; then git add -- logs/test/T6b; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "宏观数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH" && exit 0
            sleep 5
          done
          exit 1
      - name: 工作流失败告警
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: macro
          HEALTH_ITEM_NAME: 宏观数据
          HEALTH_WORKFLOW_FILE: .github/workflows/update-macro.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
