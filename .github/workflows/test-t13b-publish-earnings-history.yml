# 本分支专用手工验收工作流；不接生产调度。采集独立只读，不抢生产写锁。
name: T13b 业绩历史短发布
on:
  pull_request:
    paths: ['.github/workflows/test-t13b-publish-earnings-history.yml']
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      sha:
        required: true
      rebuild_signals:
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/gpt/T13b-earnings'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/T13b-earnings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: 锁内拉最新分支并验证采集运行身份
        env:
          INPUT_RUN: ${{ inputs.run_id }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_REBUILD: ${{ inputs.rebuild_signals }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin gpt/T13b-earnings
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          request=json.loads(Path('logs/test/T13b/发布请求.json').read_text()) if os.environ['GITHUB_EVENT_NAME']=='push' else {}
          run=str(request.get('run_id',os.environ.get('INPUT_RUN','')))
          sha=request.get('sha',os.environ.get('INPUT_SHA',''))
          rebuild=request.get('rebuild_signals',os.environ.get('INPUT_REBUILD')=='true')
          if not re.fullmatch(r'\d+',run) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not isinstance(rebuild,bool):raise ValueError('发布请求格式无效')
          info=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run}']))
          if info['head_branch']!='gpt/T13b-earnings' or info['head_sha']!=sha or info['path']!='.github/workflows/test-t13b-earnings-history.yml' or info['status']!='completed':raise ValueError('来源运行身份/工作流/完成状态不符')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'RUN_ID={run}\nSOURCE_SHA={sha}\nREBUILD={str(rebuild).lower()}\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: T13b-采集-${{ env.RUN_ID }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/t13b-artifact
      - name: 整份预检和事务晋升财报
        id: promote
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/t13b-artifact
        run: |
          python - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          files=list(Path(os.environ['ARTIFACT_DIR']).glob('*/artifact.json'))
          if len(files)!=1:raise ValueError('必须且只能有一份采集产物')
          subprocess.run([sys.executable,'scripts/earnings_history_publish.py','--artifact',str(files[0]),'--run-id',os.environ['RUN_ID'],'--sha',os.environ['SOURCE_SHA']],check=True)
          PY
      - name: 请求重建时才预检预算并写年度主线修订
        id: signals
        if: steps.promote.outcome == 'success' && env.REBUILD == 'true'
        run: |
          # backfill内部先精确预检所有分片，再原子写入，避免重复全历史计算。
          python scripts/mainline_signals.py --backfill
          python tests/verify_t13_signals.py
          python tests/verify_t13b_history.py --require-complete
      - name: 仅保存已成功晋升的产物
        if: always() && steps.promote.outcome == 'success'
        env:
          SIGNALS_OUTCOME: ${{ steps.signals.outcome }}
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          for path in data/财报/全市场单季 logs/test/T13b; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if [ "$SIGNALS_OUTCOME" = success ]; then
            git add -- data/主线 logs/主线信号_最新.json logs/主线信号_最新.md
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "T13b 业绩历史发布 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin gpt/T13b-earnings
          git push origin HEAD:gpt/T13b-earnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T13b-发布-${{ github.run_id }}
          path: |
            logs/test/T13b/
            data/财报/全市场单季/
            data/主线/历史信号修订/
            data/主线/信号修订/
            data/主线/最新.json
            data/主线/最新.md
            logs/主线信号_最新.json
            logs/主线信号_最新.md
      - name: 保存main同步上下文（只读副本）
        if: always() && steps.promote.outcome == 'success'
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          base='4b3050b6d34ca9ffa9981c6fc9885b3147501204'
          main='242097ff75269932a6873ab9304064ea8b90d591'
          subprocess.run(['git','merge-base','--is-ancestor',main,'HEAD'],check=True)
          out=Path(os.environ['RUNNER_TEMP'])/'t13b-main-context'
          paths=subprocess.check_output(['git','diff','--name-only','-z',base,main]).decode().split('\0')
          rows=[]
          for s in filter(None,paths):
              p=Path(s)
              if p.is_absolute() or '..' in p.parts or p.is_symlink():raise ValueError('上下文路径非法')
              if not p.is_file():continue
              b=p.read_bytes();target=out/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(b)
              rows.append({'path':s,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (out/'上下文.json').write_text(json.dumps({'base':base,'main':main,'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':rows},ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.promote.outcome == 'success'
        with:
          name: T13b-main同步-${{ github.run_id }}
          path: ${{ runner.temp }}/t13b-main-context/
