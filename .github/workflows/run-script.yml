name: 运行脚本并保存结果

on:
  workflow_dispatch:
    inputs:
      script:
        description: "scripts/ 下的脚本文件名，如 fetch_etf.py"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查脚本名
        run: |
          case "${{ inputs.script }}" in
            *[!A-Za-z0-9_.]*|"") echo "脚本名不合法"; exit 1;;
          esac
          test -f "scripts/${{ inputs.script }}"
      - name: 安装依赖
        run: pip install pandas numpy
      - name: 运行
        run: python3 "scripts/${{ inputs.script }}"
      - name: 把产出存回仓库
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add logs data
          git commit -m "脚本产出：${{ inputs.script }}" || exit 0
          git pull --rebase origin main
          git push
      - name: 工作流失败告警
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ITEM_ID: workflow:run-script.yml
          HEALTH_ITEM_NAME: 手动脚本
          HEALTH_WORKFLOW_FILE: .github/workflows/run-script.yml
        run: |
          alert_script="${GITHUB_WORKSPACE}/scripts/health_alert.py"
          if [ ! -f "$alert_script" ]; then
            alert_script="${RUNNER_TEMP}/health_alert.py"
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/health_alert.py?ref=${GITHUB_SHA}" -o "$alert_script"
          fi
          python3 "$alert_script" --workflow-failure
